<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>L'Union Fait La Force</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f5f7fb;
      color:#222;
      line-height:1.6;
    }

    header{
      background:linear-gradient(135deg,#0f172a,#2563eb);
      color:white;
      padding:80px 20px;
      text-align:center;
    }

    header h1{
      font-size:3rem;
      margin-bottom:20px;
    }

    header p{
      max-width:900px;
      margin:auto;
      font-size:1.2rem;
    }

    .cta{
      margin-top:30px;
    }

    .cta a{
      background:#22c55e;
      color:white;
      text-decoration:none;
      padding:15px 30px;
      border-radius:8px;
      font-weight:bold;
      display:inline-block;
      transition:0.3s;
    }

    .cta a:hover{
      background:#16a34a;
      transform:scale(1.05);
    }

    section{
      padding:70px 20px;
      max-width:1200px;
      margin:auto;
    }

    .section-title{
      text-align:center;
      margin-bottom:50px;
    }

    .section-title h2{
      font-size:2.2rem;
      color:#0f172a;
      margin-bottom:15px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:25px;
    }

    .card{
      background:white;
      border-radius:15px;
      padding:30px;
      box-shadow:0 5px 20px rgba(0,0,0,0.08);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .card h3{
      margin-bottom:15px;
      color:#2563eb;
    }

    .card p{
      color:#555;
    }

    .form-container{
      background:white;
      border-radius:20px;
      padding:40px;
      box-shadow:0 5px 25px rgba(0,0,0,0.08);
      max-width:800px;
      margin:auto;
    }

    form{
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    input, textarea, select{
      padding:15px;
      border:1px solid #d1d5db;
      border-radius:10px;
      font-size:1rem;
    }

    button{
      background:#2563eb;
      color:white;
      border:none;
      padding:16px;
      border-radius:10px;
      font-size:1rem;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#1d4ed8;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:25px;
      margin-top:40px;
    }

    .stat-box{
      background:#0f172a;
      color:white;
      padding:35px;
      border-radius:15px;
      text-align:center;
    }

    .stat-box h3{
      font-size:2rem;
      margin-bottom:10px;
      color:#22c55e;
    }

          Téléphones, voitures, voyages, courses,

        </p>
      </div>

      <div class="card">
        <h3>2️⃣ Nous regroupons les demandes</h3>
        <p>
          Plus il y a de personnes intéressées,
          plus notre pouvoir de négociation augmente.
        </p>
      </div>

      <div class="card">
        <h3>3️⃣ Nous négocions les meilleurs prix</h3>
        <p>
          Nous contactons des fournisseurs pour obtenir
          des remises exclusives et des offres de groupe.
        </p>
      </div>

      <div class="card">
        <h3>4️⃣ Vous économisez</h3>
        <p>
          Vous recevez des offres avantageuses,
          sélectionnées selon le meilleur rapport qualité/prix.
        </p>
      </div>

    </div>
  </section>

  <section>
    <div class="section-title">
      <h2>📈 Pourquoi rejoindre la plateforme ?</h2>
    </div>

    <div class="stats">

      <div class="stat-box">
        <h3>-10% à -60%</h3>
        <p>Réductions potentielles</p>
      </div>

      <div class="stat-box">
        <h3>100%</h3>
        <p>Gratuit pour les membres</p>
      </div>

      <div class="stat-box">
        <h3>+ de pouvoir</h3>
        <p>Grâce aux achats groupés</p>
      </div>

      <div class="stat-box">
        <h3>Meilleur choix</h3>
        <p>Qualité + prix optimisés</p>
      </div>

    </div>
  </section>

        <h3>📱 Smartphones</h3>

  <footer>

    <h3>🤝 Ensemble, nous achetons mieux.</h3>

    <p style="margin-top:15px;">
      L'union fait la force.
